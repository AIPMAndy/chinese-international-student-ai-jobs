name: Verify teaching examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the three technical teaching examples and risk cases
        run: python3 examples/run_all.py
      - name: Rebuild site from source
        run: python3 scripts/build_site.py --repo-url https://github.com/AIPMAndy/chinese-international-student-ai-jobs
      - name: Regenerate source, template and website archives
        run: python3 scripts/package_release.py
      - name: Validate all generated site metadata
        run: python3 scripts/check_seo.py
      - name: Verify current source archive, released website and evidence links
        run: python3 scripts/check_release.py

