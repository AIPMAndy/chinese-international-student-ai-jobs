name: Deploy verified guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'AIPMAndy/chinese-international-student-ai-jobs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the committed project
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rebuild site and downloads from authoritative sources
        run: |
          python3 scripts/build_site.py --repo-url https://github.com/AIPMAndy/chinese-international-student-ai-jobs
          python3 scripts/package_release.py
      - name: Validate all generated SEO metadata and sitemap
        run: python3 scripts/check_seo.py
      - name: Validate generated static site and downloads
        run: python3 scripts/check_pages_links.py --require downloads/chinese-international-student-ai-jobs-guide.pdf --require downloads/templates.zip --require downloads/chinese-international-student-ai-jobs-source.zip
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public HTTP, PDF and download links
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import hashlib
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = os.environ["LIVE_URL"].rstrip("/") + "/"
          checks = [
              ("", b"<!doctype html>"),
              ("jobs.html", b"<!doctype html>"),
              ("regions.html", b"<!doctype html>"),
              ("downloads/chinese-international-student-ai-jobs-guide.pdf", b"%PDF-"),
              ("downloads/templates.zip", b"PK\x03\x04"),
              ("downloads/chinese-international-student-ai-jobs-source.zip", b"PK\x03\x04"),
              ("sitemap.xml", b"<?xml"),
              ("robots.txt", b"User-agent"),
              ("assets/style.css", b":root"),
              ("assets/app.js", b""),
          ]
          for path, prefix in checks:
              url = base + path
              for attempt in range(8):
                  try:
                      request = Request(url, headers={"User-Agent": "AI-Jobs-Guide-Release-Check/1.0"})
                      with urlopen(request, timeout=15) as response:
                          data = response.read()
                          if response.status != 200 or not data.lstrip().lower().startswith(prefix.lower()):
                              raise RuntimeError(f"Invalid HTTP response or file signature at {url}")
                      expected = (Path("dist") / (path or "index.html")).read_bytes()
                      actual_sha = hashlib.sha256(data).hexdigest()
                      if actual_sha != hashlib.sha256(expected).hexdigest():
                          raise RuntimeError(f"Published file SHA-256 differs from current build: {url}")
                      print("HTTP/SHA VERIFIED", url, len(data), actual_sha, flush=True)
                      break
                  except Exception as exc:
                      if attempt == 7:
                          raise
                      print(f"Retry {attempt + 1}/8 for {url}: {exc}", flush=True)
                      time.sleep(3)
          PY
