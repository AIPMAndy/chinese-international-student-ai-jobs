name: Deploy AI guide to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'AIPMAndy/chinese-international-student-ai-jobs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the committed handbook
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify complete website and downloadable files
        run: |
          python3 scripts/check_pages_links.py --site dist --repo chinese-international-student-ai-jobs --required downloads/chinese-international-student-ai-jobs-guide.pdf --required downloads/templates.zip --required downloads/chinese-international-student-ai-jobs-source.zip
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
